[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omero-workflow-skills"
version = "0.1.0"
description = "Validated, revision-aware Agent Skills catalog for BIOMERO workflow repositories"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "NL-BioImaging" }
]
dependencies = [
  "PyYAML>=6.0,<7"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing"
]

[project.urls]
Homepage = "https://github.com/NL-BioImaging/OMERO.WorkflowSkills"
Repository = "https://github.com/NL-BioImaging/OMERO.WorkflowSkills"
Issues = "https://github.com/NL-BioImaging/OMERO.WorkflowSkills/issues"

[project.optional-dependencies]
test = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "types-PyYAML>=6.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["omero_workflow_skills"]
